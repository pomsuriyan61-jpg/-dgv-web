<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>มีอะไรจะบอก 💗</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Mali:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --bg1:#ffe4ee; --bg2:#ffb3cf; --card:rgba(255,255,255,.78);
  --text:#7a1f4a; --accent:#ff4f8b; --accent2:#ff86ae; --heart:#ff5c93; --shadow:rgba(255,79,139,.35);
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg1:#2a0f1c; --bg2:#4a1530; --card:rgba(60,20,40,.72);
    --text:#ffd9e8; --accent:#ff5c93; --accent2:#ff86ae; --heart:#ff7aa6; --shadow:rgba(255,92,147,.35);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg1:#2a0f1c; --bg2:#4a1530; --card:rgba(60,20,40,.72);
  --text:#ffd9e8; --accent:#ff5c93; --accent2:#ff86ae; --heart:#ff7aa6; --shadow:rgba(255,92,147,.35);
  color-scheme:dark;
}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{
  margin:0;height:100%;overflow:hidden;
  font-family:'Mali','Sarabun','Noto Sans Thai',system-ui,sans-serif;
  color:var(--text);
  background:linear-gradient(160deg,var(--bg1),var(--bg2));
  background-color:var(--bg1);
  display:flex;align-items:center;justify-content:center;
  padding:20px;
}
.hearts{position:fixed;inset:0;pointer-events:none;overflow:hidden}
.hearts span{
  position:absolute;bottom:-40px;color:var(--heart);opacity:.0;
  animation:rise linear infinite;
}
@keyframes rise{
  0%{transform:translateY(0) scale(.8);opacity:0}
  15%{opacity:.55}
  100%{transform:translateY(-110vh) scale(1.3) rotate(25deg);opacity:0}
}
.card{
  position:relative;z-index:1;width:100%;max-width:420px;
  background:var(--card);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
  border-radius:28px;padding:38px 26px 26px;text-align:center;
  box-shadow:0 18px 50px var(--shadow);
  min-height:360px;display:flex;flex-direction:column;justify-content:space-between;
}
.page{display:none;animation:fade .6s ease both}
.page.active{display:block}
@keyframes fade{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.big{font-size:64px;line-height:1;margin-bottom:14px;animation:beat 1.2s ease-in-out infinite}
@keyframes beat{0%,100%{transform:scale(1)}50%{transform:scale(1.15)}}
h1{font-size:26px;margin:0 0 12px;font-weight:700}
p{font-size:19px;line-height:1.7;margin:0 0 8px}
.em{color:var(--accent);font-weight:700}
.nav{display:flex;gap:10px;justify-content:center;margin-top:26px}
button{
  font-family:inherit;font-size:18px;font-weight:600;border:0;cursor:pointer;
  padding:13px 28px;border-radius:999px;color:#fff;
  background:linear-gradient(135deg,var(--accent),var(--accent2));
  box-shadow:0 8px 20px var(--shadow);transition:transform .15s;
}
button:active{transform:scale(.95)}
button.ghost{background:transparent;color:var(--accent);box-shadow:inset 0 0 0 2px var(--accent)}
.dots{display:flex;gap:8px;justify-content:center;margin-top:18px}
.dots i{width:9px;height:9px;border-radius:50%;background:var(--accent);opacity:.3;transition:.3s}
.dots i.on{opacity:1;transform:scale(1.3)}
.yes{display:none;margin-top:14px;font-size:20px;font-weight:700;color:var(--accent)}
</style>
</head>
<body>
<div class="hearts" id="hearts" aria-hidden="true"></div>

<main class="card">
  <div>
    <section class="page active" id="p0">
      <div class="big">💗</div>
      <h1>เธอๆ</h1>
      <p>มีอะไรจะบอกด้วยนะ<br>ที่อยู่ในใจมานานแล้ว…</p>
    </section>

    <section class="page" id="p1">
      <div class="big">🥺</div>
      <h1>เธอรู้ไหม</h1>
      <p>ผม<span class="em">จีบเธอมานานแล้วนะ</span></p>
      <p>อยากรู้ว่า… เธอรู้ไหม?</p>
    </section>

    <section class="page" id="p2">
      <div class="big">💖</div>
      <h1>ตอนนี้…</h1>
      <p>ผมอยากขอคุณ<span class="em">เป็นแฟน</span></p>
      <p>อย่าปฏิเสธนะ ผมจริงจัง<br>คุณตัดสินใจดีๆ นะ<br>อย่าทิ้งกันเลยนะ 🌷</p>
      <div class="yes" id="yes">💞 ขอบคุณที่ใจดีกับผมนะ 💞</div>
    </section>
  </div>

  <div>
    <div class="nav" id="nav"></div>
    <div class="dots" id="dots"><i class="on"></i><i></i><i></i></div>
  </div>
</main>

<script>
(function(){
  var cur=0, total=3;
  var pages=[0,1,2].map(function(i){return document.getElementById('p'+i)});
  var dots=document.querySelectorAll('#dots i');
  var nav=document.getElementById('nav');

  function btn(label,cls,fn){
    var b=document.createElement('button');
    b.textContent=label; if(cls) b.className=cls; b.onclick=fn; return b;
  }
  function render(){
    pages.forEach(function(p,i){p.classList.toggle('active',i===cur)});
    dots.forEach(function(d,i){d.classList.toggle('on',i===cur)});
    nav.innerHTML='';
    if(cur>0) nav.appendChild(btn('ย้อนกลับ','ghost',function(){cur--;render()}));
    if(cur<total-1) nav.appendChild(btn('ถัดไป 💌','',function(){cur++;render()}));
    else nav.appendChild(btn('ตอบตกลง 💘','',function(){
      document.getElementById('yes').style.display='block';
      burst();
    }));
  }

  var box=document.getElementById('hearts');
  var icons=['💗','💖','💕','❤️','🌸'];
  function spawn(){
    var s=document.createElement('span');
    s.textContent=icons[Math.floor(Math.random()*icons.length)];
    s.style.left=Math.random()*100+'%';
    s.style.fontSize=(14+Math.random()*22)+'px';
    var d=6+Math.random()*6;
    s.style.animationDuration=d+'s';
    box.appendChild(s);
    setTimeout(function(){s.remove()},d*1000);
  }
  function burst(){for(var i=0;i<24;i++)setTimeout(spawn,i*60)}
  setInterval(spawn,700);
  for(var i=0;i<8;i++)setTimeout(spawn,i*200);

  render();
})();
</script>
</body>
</html>
